<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EzDeck</title>
<style>
  :root{color-scheme:dark;--bg:#160904;--bg2:#552007;--glass:rgba(51,28,20,.76);--line:rgba(245,177,132,.45);--ink:#fff7f0;--sub:#d9b7a3;--accent:#fa8537;--tile:clamp(126px,10vw,166px)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 12%,#7b350e 0,transparent 34%),linear-gradient(145deg,var(--bg2),var(--bg) 56%,#060302);font-family:Segoe UI,system-ui,sans-serif;color:var(--ink);user-select:none}
  header{height:74px;display:flex;align-items:center;padding:0 30px;gap:16px;background:rgba(16,7,4,.64);border-bottom:1px solid rgba(255,255,255,.08)}
  .brand{font-size:25px;font-weight:800;letter-spacing:-.04em}.brand b{color:var(--accent)}.status{margin-left:auto;font-size:13px;color:var(--sub)}.pin{font-weight:800;color:#fff;font-size:16px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#32170d}
  main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(540px,2.1fr);gap:24px;padding:26px;max-width:1500px;margin:auto}.pane{min-height:calc(100vh - 126px);padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:linear-gradient(145deg,rgba(63,35,25,.76),rgba(20,11,8,.78));box-shadow:0 22px 60px rgba(0,0,0,.27)}
  h1{font-size:17px;margin:0 0 14px}input,select{width:100%;color:var(--ink);font:inherit;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(8,4,3,.48);padding:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}
  .library{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;align-content:start;overflow:auto;max-height:calc(100vh - 250px);padding:14px 2px}.library-card{position:relative;min-height:128px;padding:10px 7px;border:1px solid rgba(255,255,255,.12);border-radius:17px;background:rgba(9,4,2,.36);cursor:grab;text-align:center}.library-card:hover{border-color:var(--line);background:rgba(139,64,18,.32)}.library-card img,.library-card .icon{width:70px;height:70px;margin:auto;border-radius:17px;object-fit:contain;background:#24130c}.library-card .icon{display:grid;place-items:center;color:white;font-size:27px;background:linear-gradient(145deg,#f39624,#a32217)}.library-card label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;margin-top:8px;color:var(--sub)}
  .toolbar{display:flex;gap:9px;margin-bottom:16px}.toolbar input{flex:1}.button{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:#fff;background:rgba(111,51,15,.75);cursor:pointer;font:600 13px inherit}.button:hover{background:#b14b15}.button.key{font-size:18px;padding:7px 13px}.button.danger{margin-left:auto;background:rgba(105,26,19,.68);border-color:rgba(255,126,112,.42)}
  .deck-wrap{display:flex;flex-direction:column;gap:15px}.hint{font-size:12px;color:var(--sub);margin:0}.deck{display:grid;grid-template-columns:repeat(4,var(--tile));grid-template-rows:repeat(2,var(--tile));justify-content:center;gap:17px;padding:18px;min-height:calc(var(--tile) * 2 + 54px);border:1px dashed rgba(255,255,255,.15);border-radius:25px;background:rgba(4,2,1,.25)}.pagebar{display:flex;justify-content:center;align-items:center;gap:9px}.pagebar .button{min-width:38px}.pagebar span{font-size:12px;color:var(--sub);min-width:80px;text-align:center}
  .slot{border:1px solid rgba(242,133,54,.22);border-radius:26px;background:linear-gradient(145deg,rgba(74,34,18,.67),rgba(17,8,5,.55));transition:.14s}.slot.over{outline:3px solid var(--accent);transform:scale(1.045)}.tile{position:relative;width:100%;height:100%;padding:9px;border:0;border-radius:25px;background:linear-gradient(145deg,rgba(130,95,77,.95),rgba(56,28,17,.96));box-shadow:inset 0 1px rgba(255,255,255,.33),0 10px 22px rgba(0,0,0,.22);cursor:grab;color:white}.tile:active{cursor:grabbing}.tile img,.tile .icon{width:100%;height:calc(var(--tile) - 47px);border-radius:19px;object-fit:contain;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,#df7d20,#72210f)}.tile label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin:6px 4px 0}.remove{position:absolute;right:-7px;top:-7px;width:24px;height:24px;border:0;border-radius:50%;background:#a52e20;color:#fff;font-size:16px;cursor:pointer;opacity:0}.tile:hover .remove{opacity:1}.trash{height:38px;border:1px dashed rgba(255,130,110,.5);border-radius:12px;color:#f1a18d;display:grid;place-items:center;font-size:12px}.trash.over{background:rgba(163,37,22,.35)}
  dialog{width:min(460px,calc(100vw - 32px));border:1px solid var(--line);border-radius:24px;background:#27130d;color:var(--ink);box-shadow:0 25px 80px #000}.form{display:grid;gap:13px}.form h2{margin:0;font-size:19px}.mods{display:flex;flex-wrap:wrap;gap:7px}.mods label{padding:8px 10px;border:1px solid rgba(255,255,255,.17);border-radius:10px;font-size:13px;cursor:pointer}.mods input{width:auto;margin-right:4px}.form .actions{display:flex;gap:8px;justify-content:end}.form canvas{display:block;width:86px;height:86px;margin:9px auto 0;border-radius:18px;border:1px solid rgba(255,255,255,.2)}.error{height:18px;color:#ffb19f;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:12px;background:#28201e;border:1px solid var(--line);opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
  @media(max-width:850px){main{grid-template-columns:1fr}.pane{min-height:0}.deck{--tile:min(20vw,110px)}}
</style>
<body><header><div class="brand">Ez<span>Deck</span></div><div class="status" id="network">Conectando…</div><div class="pin" id="pin">PIN —</div></header>
<main><section class="pane"><div class="toolbar"><input id="search" placeholder="Buscar apps"><button class="button key" id="new-key" title="Criar atalho de teclado">⌨</button><button class="button key" id="add-file" title="Adicionar .exe, .lnk, .bat ou .cmd">＋</button><button class="button" id="refresh">↻</button><input id="app-file" type="file" accept=".exe,.lnk,.appref-ms,.bat,.cmd" hidden></div><div class="library" id="library"></div></section><section class="pane deck-wrap"><div class="toolbar"><h1>Prévia do Android (8 botões)</h1><button class="button danger" id="shutdown">Desligar EzDeck</button></div><p class="hint">Arraste para organizar. Clique esquerdo num atalho ou app adicionado por você para editar o ícone.</p><div class="deck" id="deck"></div><div class="pagebar"><button class="button" id="prev-page">‹</button><span id="page-label">Página 1</span><button class="button" id="next-page">›</button><button class="button" id="add-page">＋ Página</button></div><div class="trash" id="trash">Arraste aqui para remover do painel</div></section></main>
<dialog id="key-dialog"><form class="form" method="dialog"><h2>Novo atalho</h2><input id="key-title" placeholder="Nome (ex.: Desktop anterior)" maxlength="70" required><div class="mods"><label><input type="checkbox" value="Ctrl">Ctrl</label><label><input type="checkbox" value="Alt">Alt</label><label><input type="checkbox" value="Shift">Shift</label><label><input type="checkbox" value="Win">Win</label></div><select id="key-value"></select><label>Imagem personalizada <input id="key-icon" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Editor de ícone <input id="key-color" type="color" value="#df7d20"> <canvas id="key-preview" width="256" height="256" aria-label="Prévia do ícone"></canvas></label><div class="error" id="form-error"></div><div class="actions"><button class="button" value="cancel">Cancelar</button><button class="button" id="save-key" value="default">Adicionar</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id), token=new URLSearchParams(location.search).get('token')||'', head={'X-EzDeck-Host':token,'Content-Type':'application/json'};let apps=[],actions=[],cfg={pieces:[],revision:0,pageCount:1,limits:{maxPages:5}},drag=null,currentPage=0,editing=null;
const keys=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789','Enter','Tab','Space','Escape','Backspace','Delete','Insert','Home','End','PageUp','PageDown','Left','Up','Right','Down','PrintScreen','VolumeMute','VolumeDown','VolumeUp','MediaNext','MediaPrevious','MediaStop','MediaPlayPause',...Array.from({length:24},(_,i)=>'F'+(i+1))]; $('key-value').innerHTML=keys.map(k=>'<option>'+k+'</option>').join('');
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...head,...(opt.headers||{})}});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'Não foi possível concluir');return body}function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),2400)}
let iconDirty=false;function drawShortcutIcon(){const c=$('key-preview'),x=c.getContext('2d'),title=$('key-title').value.trim()||'T',color=$('key-color').value;x.clearRect(0,0,256,256);x.fillStyle=color;x.fillRect(0,0,256,256);x.fillStyle='rgba(255,255,255,.15)';x.beginPath();x.arc(42,35,96,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='700 132px Segoe UI,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(title[0].toUpperCase(),128,139)}$('key-title').addEventListener('input',()=>{iconDirty=true;drawShortcutIcon()});$('key-color').addEventListener('input',()=>{iconDirty=true;drawShortcutIcon()});$('key-icon').addEventListener('change',()=>iconDirty=true);
function openEditor(a){const action=actions.find(x=>x.name===a.name);if(!action){toast('Este é um app do Windows. Ícones editáveis estão disponíveis para atalhos e apps adicionados pelo botão ＋.');return}editing=action;const shortcut=action.type==='shortcut';$('key-dialog').querySelector('h2').textContent=shortcut?'Editar atalho e ícone':'Editar ícone';$('key-title').value=action.title;$('key-title').disabled=!shortcut;document.querySelector('.mods').style.display=shortcut?'flex':'none';$('key-value').style.display=shortcut?'block':'none';if(shortcut){const p=action.combo.split('+');document.querySelectorAll('.mods input').forEach(x=>x.checked=p.includes(x.value));$('key-value').value=p[p.length-1]}$('form-error').textContent='';$('key-icon').value='';iconDirty=false;drawShortcutIcon();$('key-dialog').showModal()}
function icon(a){const safe=encodeURIComponent(a.name);return a.icon?'<img loading="lazy" src="/api/apps/'+safe+'/icon" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'icon\',textContent:'+JSON.stringify((a.name||'?')[0])+ ' }))">':'<div class="icon">'+(a.name||'?')[0]+'</div>'}
function card(a,slot){const el=document.createElement(slot?'button':'div');el.type='button';el.className=slot?'tile':'library-card';el.draggable=true;el.dataset.name=a.name;el.dataset.id=a.id||'';el.innerHTML=icon(a)+'<label>'+a.name.replace(/^Teclado · /,'⌨ ')+'</label>'+(slot?'<span class="remove" title="Remover">×</span>':'');el.addEventListener('dragstart',e=>{drag={name:a.name,id:a.id||'',from:slot?'deck':'library'};e.dataTransfer.effectAllowed='move'});if(slot){el.querySelector('.remove').onclick=e=>{e.stopPropagation();removePiece(a.id)};el.onclick=e=>{if(!e.target.closest('.remove'))openEditor(a)}}return el}
function renderLibrary(){const q=$('search').value.toLowerCase();$('library').replaceChildren(...apps.filter(a=>a.name.toLowerCase().includes(q)).map(a=>card(a,false)))}
function renderDeck(){const by=new Map(cfg.pieces.map(p=>[p.position,p]));const slots=[],first=currentPage*8;for(let n=first;n<first+8;n++){const s=document.createElement('div');s.className='slot';s.dataset.position=n;const p=by.get(n);if(p){const app=apps.find(a=>a.name===p.name)||{...p,icon:false};s.append(card({...app,id:p.id},true))}s.ondragover=e=>{e.preventDefault();s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=e=>{e.preventDefault();s.classList.remove('over');dropTo(n)};slots.push(s)}$('deck').replaceChildren(...slots);const total=Math.max(1,cfg.pageCount||1);$('page-label').textContent='Página '+(currentPage+1)+' de '+total;$('prev-page').disabled=currentPage===0;$('next-page').disabled=currentPage>=total-1;$('add-page').disabled=total>=(cfg.limits?.maxPages||5)}
async function updatePositions(next){const positions={};next.forEach(p=>positions[p.id]=p.position);cfg=(await api('/api/config/pieces/order',{method:'PUT',body:JSON.stringify({revision:cfg.revision,ids:cfg.pieces.map(p=>p.id),positions})})).config;renderDeck()}
async function dropTo(position){if(!drag)return;try{const source=drag;drag=null;if(source.from==='library'){if(cfg.pieces.some(p=>p.position===position))return toast('Escolha um espaço vazio');if(!cfg.pieces.some(p=>p.name===source.name)){cfg=(await api('/api/config/pinned',{method:'POST',body:JSON.stringify({app:source.name})})).config}const added=cfg.pieces.find(p=>p.name===source.name);const next=cfg.pieces.map(p=>({...p}));next.find(p=>p.id===added.id).position=position;await updatePositions(next);toast('Adicionado ao painel')}else{const current=cfg.pieces.find(p=>p.id===source.id),other=cfg.pieces.find(p=>p.position===position);if(!current)return;if(other)other.position=current.position;current.position=position;await updatePositions(cfg.pieces.map(p=>({...p})))}}catch(e){toast(e.message)}}
async function removePiece(id){try{cfg=(await api('/api/config/pieces/'+encodeURIComponent(id),{method:'DELETE',body:JSON.stringify({revision:cfg.revision})})).config;renderDeck();toast('Removido do painel')}catch(e){toast(e.message)}}
async function load(){const [installed,config,status,stored]=await Promise.all([api('/api/apps/installed'),api('/api/config'),api('/api/windows/status'),api('/api/windows/actions')]);apps=installed.apps;actions=stored.actions||[];cfg=config.config;$('pin').textContent='PIN '+(status.pin||'—');$('network').textContent=status.address?'Android: http://'+status.address+':3100':'Android na mesma rede Wi-Fi';renderLibrary();renderDeck()}
$('search').oninput=renderLibrary;$('refresh').onclick=async()=>{try{await api('/api/windows/refresh-apps',{method:'POST',body:'{}'});await load();toast('Lista atualizada no Android')}catch(e){toast(e.message)}};$('new-key').onclick=()=>{$('key-dialog').showModal();drawShortcutIcon();$('key-title').focus()};$('save-key').onclick=async e=>{e.preventDefault();const title=$('key-title').value.trim(),mods=[...document.querySelectorAll('.mods input:checked')].map(x=>x.value),combo=[...mods,$('key-value').value].join('+');try{if(!title)throw Error('Informe um nome');let r=await api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'shortcut',title,combo})});const image=$('key-icon').files[0];const dataUrl=image?await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(image)}):$('key-preview').toDataURL('image/png');r=await api('/api/windows/actions/icon',{method:'POST',body:JSON.stringify({name:r.action.name,dataUrl})});apps=apps.filter(a=>a.name!==r.action.name);apps.push({name:r.action.name,icon:true});$('key-dialog').close();$('key-title').value='';$('key-icon').value='';renderLibrary();drag={name:r.action.name,from:'library'};await dropTo(cfg.pieces.findIndex((p,i)=>p.position!==i));toast('Atalho criado')}catch(err){$('form-error').textContent=err.message}};function addFile(path,name){api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'app',title:name.replace(/\.[^.]+$/,''),path})}).then(async r=>{apps.push({name:r.action.name,icon:true});renderLibrary();drag={name:r.action.name,from:'library'};await dropTo(cfg.pieces.findIndex((p,i)=>p.position!==i));toast('Adicionado ao painel')}).catch(e=>toast(e.message))}$('add-file').onclick=()=>{if(window.chrome?.webview)window.chrome.webview.postMessage({type:'choose-file'});else $('app-file').click()};$('app-file').onchange=()=>{const file=$('app-file').files[0];if(file?.path)addFile(file.path,file.name);$('app-file').value=''};if(window.chrome?.webview)window.chrome.webview.addEventListener('message',e=>{if(e.data?.type==='file')addFile(e.data.path,e.data.name)});
$('new-key').onclick=()=>{editing=null;$('key-dialog').querySelector('h2').textContent='Novo atalho';$('key-title').disabled=false;$('key-title').value='';document.querySelector('.mods').style.display='flex';$('key-value').style.display='block';$('key-icon').value='';iconDirty=true;drawShortcutIcon();$('key-dialog').showModal();$('key-title').focus()};$('save-key').onclick=async e=>{e.preventDefault();try{const title=$('key-title').value.trim(),shortcut=!editing||editing.type==='shortcut',mods=[...document.querySelectorAll('.mods input:checked')].map(x=>x.value),combo=[...mods,$('key-value').value].join('+');if(!title)throw Error('Informe um nome');let action;if(shortcut)action=await api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'shortcut',title,combo})});else action=await api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'app',title:editing.title,path:editing.path})});if(iconDirty){const image=$('key-icon').files[0],dataUrl=image?await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(image)}):$('key-preview').toDataURL('image/png');action=await api('/api/windows/actions/icon',{method:'POST',body:JSON.stringify({name:action.action.name,dataUrl})})}$('key-dialog').close();await load();toast(editing?'Alterações salvas':'Atalho criado')}catch(err){$('form-error').textContent=err.message}};$('prev-page').onclick=()=>{if(currentPage){currentPage--;renderDeck()}};$('next-page').onclick=()=>{if(currentPage<(cfg.pageCount||1)-1){currentPage++;renderDeck()}};$('add-page').onclick=async()=>{try{cfg=(await api('/api/config/pages',{method:'POST',body:'{}'})).config;currentPage=cfg.pageCount-1;renderDeck();toast('Nova página criada')}catch(e){toast(e.message)}};
$('trash').ondragover=e=>{e.preventDefault();$('trash').classList.add('over')};$('trash').ondragleave=()=>$('trash').classList.remove('over');$('trash').ondrop=e=>{e.preventDefault();$('trash').classList.remove('over');if(drag?.id)removePiece(drag.id);drag=null};$('shutdown').onclick=async()=>{if(confirm('Desligar o EzDeck?')){await api('/api/windows/shutdown',{method:'POST',body:'{}'});document.body.innerHTML='<main><section class="pane"><h1>EzDeck desligado.</h1></section></main>'}};load().catch(e=>toast(e.message));})();
</script></body></html>
