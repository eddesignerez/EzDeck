<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EzDeck</title>
<style>
  :root{color-scheme:dark;--bg:#160904;--bg2:#552007;--glass:rgba(51,28,20,.76);--line:rgba(245,177,132,.45);--ink:#fff7f0;--sub:#d9b7a3;--accent:#fa8537;--tile:clamp(126px,10vw,166px)}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% 12%,#7b350e 0,transparent 34%),linear-gradient(145deg,var(--bg2),var(--bg) 56%,#060302);font-family:Segoe UI,system-ui,sans-serif;color:var(--ink);user-select:none}
  header{height:74px;display:flex;align-items:center;padding:0 30px;gap:16px;background:rgba(16,7,4,.64);border-bottom:1px solid rgba(255,255,255,.08)}
  .brand{display:flex;align-items:center;gap:0;font-size:25px;font-weight:800;letter-spacing:-.04em}.brand-logo{width:31px;height:31px;object-fit:contain}.brand b{color:var(--accent)}.status{margin-left:auto;font-size:13px;color:var(--sub)}.pin{font-weight:800;color:#fff;font-size:16px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#32170d}
  main{display:grid;grid-template-columns:minmax(260px,1fr) minmax(540px,2.1fr);gap:24px;padding:26px;max-width:1500px;margin:auto}.pane{min-height:calc(100vh - 126px);padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:linear-gradient(145deg,rgba(63,35,25,.76),rgba(20,11,8,.78));box-shadow:0 22px 60px rgba(0,0,0,.27)}
  h1{font-size:17px;margin:0 0 14px}input,select{width:100%;color:var(--ink);font:inherit;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:rgba(8,4,3,.48);padding:12px;outline:none}input:focus,select:focus{border-color:var(--accent)}
  .library{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:12px;align-content:start;overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 250px);padding:14px 8px}.library-card{position:relative;min-width:0;min-height:128px;padding:10px 7px;border:1px solid rgba(255,255,255,.12);border-radius:17px;background:rgba(9,4,2,.36);cursor:grab;text-align:center;overflow:hidden}.library-card:hover{border-color:var(--line);background:rgba(139,64,18,.32)}.library-card img,.library-card .icon{width:70px;height:70px;margin:auto;border-radius:17px;object-fit:contain;background:#24130c}.library-card .icon{display:grid;place-items:center;color:white;font-size:27px;background:linear-gradient(145deg,#f39624,#a32217)}.library-card label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;margin-top:8px;color:var(--sub)}.library-card .remove{top:6px;right:6px;width:21px;height:21px;font-size:14px;opacity:1;border-width:1px}
  .toolbar{display:flex;gap:9px;margin-bottom:16px}.toolbar input{flex:1}.button{border:1px solid var(--line);border-radius:12px;padding:10px 13px;color:#fff;background:rgba(111,51,15,.75);cursor:pointer;font:600 13px inherit}.button:hover{background:#b14b15}.button.key{font-size:18px;padding:7px 13px}.button.danger{margin-left:auto;background:rgba(105,26,19,.68);border-color:rgba(255,126,112,.42)}
  .deck-wrap{display:flex;flex-direction:column;gap:15px}.hint{font-size:12px;color:var(--sub);margin:0}.deck{display:grid;grid-template-columns:repeat(4,var(--tile));grid-template-rows:repeat(2,var(--tile));justify-content:center;gap:17px;padding:18px;min-height:calc(var(--tile) * 2 + 54px);border:1px dashed rgba(255,255,255,.15);border-radius:25px;background:rgba(4,2,1,.25)}.pagebar{display:flex;justify-content:center;align-items:center;gap:9px}.pagebar .button{min-width:38px}.pagebar span{font-size:12px;color:var(--sub);min-width:80px;text-align:center}
  .slot{border:1px solid rgba(242,133,54,.22);border-radius:26px;background:linear-gradient(145deg,rgba(74,34,18,.67),rgba(17,8,5,.55));transition:.14s}.slot.over{outline:3px solid var(--accent);transform:scale(1.045)}.tile{position:relative;width:100%;height:100%;padding:9px;border:0;border-radius:25px;background:linear-gradient(145deg,rgba(130,95,77,.95),rgba(56,28,17,.96));box-shadow:inset 0 1px rgba(255,255,255,.33),0 10px 22px rgba(0,0,0,.22);cursor:grab;color:white}.tile:active{cursor:grabbing}.tile img,.tile .icon{width:100%;height:calc(var(--tile) - 47px);border-radius:19px;object-fit:contain;display:grid;place-items:center;font-size:40px;background:linear-gradient(145deg,#df7d20,#72210f)}.tile label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;margin:6px 4px 0}.remove{position:absolute;right:-7px;top:-7px;width:24px;height:24px;border:0;border-radius:50%;background:#a52e20;color:#fff;font-size:16px;cursor:pointer;opacity:0}.tile:hover .remove{opacity:1}.trash{height:38px;border:1px dashed rgba(255,130,110,.5);border-radius:12px;color:#f1a18d;display:grid;place-items:center;font-size:12px}.trash.over{background:rgba(163,37,22,.35)}
  dialog{width:min(460px,calc(100vw - 32px));border:1px solid var(--line);border-radius:24px;background:#27130d;color:var(--ink);box-shadow:0 25px 80px #000}.form{display:grid;gap:13px}.form h2{margin:0;font-size:19px}.mods{display:flex;flex-wrap:wrap;gap:7px}.mods label{padding:8px 10px;border:1px solid rgba(255,255,255,.17);border-radius:10px;font-size:13px;cursor:pointer}.mods input{width:auto;margin-right:4px}.form .actions{display:flex;gap:8px;justify-content:end}.form canvas{display:block;width:86px;height:86px;margin:9px auto 0;border-radius:18px;border:1px solid rgba(255,255,255,.2)}.error{height:18px;color:#ffb19f;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:12px;background:#28201e;border:1px solid var(--line);opacity:0;transition:.2s;pointer-events:none}.toast.on{opacity:1}
  @media(max-width:850px){main{grid-template-columns:1fr}.pane{min-height:0}.deck{--tile:min(20vw,110px)}}
  /* Jeton editorial light theme */
  :root{color-scheme:light;--bg:#fff;--bg2:#fdedea;--glass:#fff;--line:rgba(54,8,2,.13);--ink:#360802;--sub:rgba(54,8,2,.62);--accent:#f73b20}
  body{background:radial-gradient(circle at 90% 0,#fdedea 0,transparent 34%),#fff;color:var(--ink)}
  header{background:rgba(255,255,255,.9);border-color:rgba(54,8,2,.1);backdrop-filter:blur(18px)}
  .brand span{color:var(--accent)}.pin{color:var(--ink);background:#fff;border-color:var(--accent)}
  main{max-width:1500px}.pane{background:#fff;border-color:rgba(54,8,2,.1);box-shadow:rgba(0,0,0,.05) 0 -4px 16px}
  input,select{color:var(--ink);background:#fdedea;border-color:rgba(247,59,32,.18)}
  .library-card{background:#fff;border-color:rgba(54,8,2,.1);border-radius:16px}.library-card:hover{background:#fdedea;border-color:#f73b20}
  .library-card img,.library-card .icon{background:#fdedea}.library-card label{color:var(--ink)}
  .button{background:#fff;color:var(--accent);border-color:var(--accent);border-radius:12px}.button:hover{background:#f73b20;color:#fff}.button.danger{background:#fff;color:#fb2d54;border-color:#fb2d54}
  .deck{background:#fff;border-color:rgba(54,8,2,.11)}.slot{background:rgba(247,59,32,.045);border-color:rgba(247,59,32,.18);border-radius:16px}.tile{background:#fff;color:var(--ink);border-radius:16px;box-shadow:rgba(0,0,0,.05) 0 -4px 16px}.tile img,.tile .icon{background:#fdedea;border-radius:13px}.tile label{color:var(--ink)}
  .trash{color:#fb2d54;border-color:rgba(251,45,84,.4)}.trash.over{background:#fdedea}.pagebar span{color:var(--sub)}
  dialog{background:#fff;color:var(--ink);border-color:rgba(54,8,2,.12)}.mods label{border-color:rgba(54,8,2,.14)}.toast{background:#360802;color:#fff;border-color:#360802}
  /* Área segura: ícones e imagens personalizadas nunca ultrapassam o card. */
  .tile img,.tile .icon{width:54%;height:54%;max-width:54%;max-height:54%;margin:8% auto 0;object-fit:contain;overflow:hidden}.library-card img,.library-card .icon{width:62px;height:62px;object-fit:contain}.tile{overflow:visible}.remove{z-index:20;opacity:1;top:-12px;right:-12px;border:2px solid #fff;box-shadow:0 2px 7px rgba(54,8,2,.3)}
  /* Imagens escolhidas pelo usuário ocupam uma área útil maior, ainda contida no card. */
  .tile img{width:62%;height:62%;max-width:62%;max-height:62%}.tile.custom-icon img{width:72%;height:72%;max-width:72%;max-height:72%;margin-top:3%}.library-card.custom-icon img{width:72px;height:72px}.search-wrap{position:relative;flex:1}.search-wrap input{padding-right:38px}.clear-search{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:22px;cursor:pointer}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#160904;--bg2:#552007;--glass:rgba(51,28,20,.76);--line:rgba(245,177,132,.45);--ink:#fff7f0;--sub:#d9b7a3;--accent:#ff813b}
  :root[data-theme="dark"] body{background:radial-gradient(circle at 72% 12%,#7b350e 0,transparent 34%),linear-gradient(145deg,var(--bg2),var(--bg) 56%,#060302);color:var(--ink)}
  :root[data-theme="dark"] header{background:rgba(16,7,4,.7);border-color:rgba(255,255,255,.08)}:root[data-theme="dark"] .pin{color:#fff;background:#32170d;border-color:var(--line)}
  :root[data-theme="dark"] .pane{background:linear-gradient(145deg,rgba(63,35,25,.76),rgba(20,11,8,.78));border-color:rgba(255,255,255,.12);box-shadow:0 22px 60px rgba(0,0,0,.27)}
  :root[data-theme="dark"] input,:root[data-theme="dark"] select{color:var(--ink);background:rgba(8,4,3,.48);border-color:rgba(255,255,255,.18)}
  :root[data-theme="dark"] .library-card{background:rgba(9,4,2,.36);border-color:rgba(255,255,255,.12)}:root[data-theme="dark"] .library-card:hover{background:rgba(139,64,18,.32);border-color:var(--line)}:root[data-theme="dark"] .library-card label,:root[data-theme="dark"] .tile label{color:var(--sub)}
  :root[data-theme="dark"] .button{background:rgba(111,51,15,.75);color:#fff;border-color:var(--line)}:root[data-theme="dark"] .button:hover{background:#b14b15}:root[data-theme="dark"] .button.danger{background:rgba(105,26,19,.68);border-color:rgba(255,126,112,.42);color:#fff}
  :root[data-theme="dark"] .deck{background:rgba(4,2,1,.25);border-color:rgba(255,255,255,.15)}:root[data-theme="dark"] .slot{background:linear-gradient(145deg,rgba(74,34,18,.67),rgba(17,8,5,.55));border-color:rgba(242,133,54,.22)}:root[data-theme="dark"] .tile{background:linear-gradient(145deg,rgba(130,95,77,.95),rgba(56,28,17,.96));color:#fff}:root[data-theme="dark"] dialog{background:#27130d;color:var(--ink);border-color:var(--line)}
</style>
<body><header><div class="brand">Ez<span>Deck</span></div><div class="status" id="network">Conectando…</div><button class="button" id="port" title="Alterar a porta de acesso">PORTA —</button><button class="pin" id="pin" title="Clique para definir o PIN">PIN —</button><button class="button" id="pin-auto" title="Gerar PIN automático">AUTO</button><button class="button" id="theme-toggle" title="Ativar modo escuro" aria-label="Ativar modo escuro">☾</button></header>
<main><section class="pane"><div class="toolbar"><input id="search" placeholder="Buscar apps"><button class="button key" id="new-key" title="Criar atalho de teclado">⌨</button><button class="button key" id="add-file" title="Adicionar .exe, .lnk, .bat ou .cmd">＋</button><button class="button" id="refresh">↻</button><input id="app-file" type="file" accept=".exe,.lnk,.appref-ms,.bat,.cmd" hidden></div><div class="library" id="library"></div></section><section class="pane deck-wrap"><div class="toolbar"><h1>Prévia (8 botões)</h1><button class="button danger" id="shutdown">Desligar EzDeck</button></div><p class="hint">Arraste para organizar. Clique esquerdo num atalho ou app adicionado por você para editar o ícone.</p><div class="deck" id="deck"></div><div class="pagebar"><button class="button" id="remove-page" title="Remove a última página vazia">− Página</button><button class="button" id="prev-page">‹</button><span id="page-label">Página 1</span><button class="button" id="next-page">›</button><button class="button" id="add-page">＋ Página</button></div><div class="trash" id="trash">Arraste aqui para remover do painel</div></section></main>
<dialog id="key-dialog"><form class="form" method="dialog"><h2>Novo atalho</h2><input id="key-title" placeholder="Nome (ex.: Desktop anterior)" maxlength="70" required><div class="mods"><label><input type="checkbox" value="Ctrl">Ctrl</label><label><input type="checkbox" value="Alt">Alt</label><label><input type="checkbox" value="Shift">Shift</label><label><input type="checkbox" value="Win">Win</label></div><select id="key-value"></select><label>Imagem personalizada <input id="key-icon" type="file" accept="image/png,image/jpeg,image/webp"></label><label>Editor de ícone <input id="key-color" type="color" value="#df7d20"> <canvas id="key-preview" width="256" height="256" aria-label="Prévia do ícone"></canvas></label><div class="error" id="form-error"></div><div class="actions"><button class="button" value="cancel">Cancelar</button><button class="button" id="save-key" value="default">Adicionar</button></div></form></dialog><div class="toast" id="toast"></div>
<script>
(()=>{const $=id=>document.getElementById(id), token=new URLSearchParams(location.search).get('token')||'', head={'X-EzDeck-Host':token,'Content-Type':'application/json'};let apps=[],actions=[],cfg={pieces:[],revision:0,pageCount:1,limits:{maxPages:5}},drag=null,currentPage=0,editing=null,iconEpoch=Date.now();
const keys=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789','Enter','Tab','Space','Escape','Backspace','Delete','Insert','Home','End','PageUp','PageDown','Left','Up','Right','Down','PrintScreen','VolumeMute','VolumeDown','VolumeUp','MediaNext','MediaPrevious','MediaStop','MediaPlayPause',...Array.from({length:24},(_,i)=>'F'+(i+1))]; $('key-value').innerHTML=keys.map(k=>'<option>'+k+'</option>').join('');
const startupLabel=document.createElement('label');startupLabel.style.cssText='display:flex;align-items:center;gap:9px;margin-top:auto;font-size:13px;padding-top:10px;cursor:pointer';startupLabel.innerHTML='<input id="start-with-windows" type="checkbox" style="width:17px;height:17px;accent-color:#f73b20"> Iniciar com Windows';document.querySelector('.deck-wrap').append(startupLabel);
api('/api/windows/startup').then(r=>{$('start-with-windows').checked=r.enabled}).catch(()=>{});
$('start-with-windows').onchange=async event=>{const checkbox=event.target,selected=checkbox.checked;checkbox.disabled=true;try{checkbox.checked=(await api('/api/windows/startup',{method:'POST',body:JSON.stringify({enabled:selected})})).enabled;toast(checkbox.checked?'Inicialização com Windows ativada':'Inicialização com Windows desativada')}catch(error){checkbox.checked=!selected;toast(error.message)}finally{checkbox.disabled=false}};
if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>{if(event.data?.type==='host-error')toast(event.data.error)});
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{...head,...(opt.headers||{})}});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'Não foi possível concluir');return body}function toast(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),2400)}
let iconDirty=false;function drawShortcutIcon(){const c=$('key-preview'),x=c.getContext('2d'),title=$('key-title').value.trim()||'T',color=$('key-color').value;x.clearRect(0,0,256,256);x.fillStyle=color;x.fillRect(0,0,256,256);x.fillStyle='rgba(255,255,255,.15)';x.beginPath();x.arc(42,35,96,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='700 132px Segoe UI,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(title[0].toUpperCase(),128,139)}$('key-title').addEventListener('input',()=>{iconDirty=true;drawShortcutIcon()});$('key-color').addEventListener('input',()=>{iconDirty=true;drawShortcutIcon()});$('key-icon').addEventListener('change',()=>iconDirty=true);
function openEditor(a){const action=actions.find(x=>x.name===a.name)||{name:a.name,title:a.name,type:'system'};editing=action;const shortcut=action.type==='shortcut';$('key-dialog').querySelector('h2').textContent=shortcut?'Editar atalho e ícone':'Editar ícone';$('key-title').value=action.title;$('key-title').disabled=!shortcut;document.querySelector('.mods').style.display=shortcut?'flex':'none';$('key-value').style.display=shortcut?'block':'none';if(shortcut){const p=action.combo.split('+');document.querySelectorAll('.mods input').forEach(x=>x.checked=p.includes(x.value));$('key-value').value=p[p.length-1]}$('form-error').textContent='';$('key-icon').value='';iconDirty=false;drawShortcutIcon();$('key-dialog').showModal()}
async function fitIcon(file){const source=await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)}),sample=document.createElement('canvas'),sampleMax=512,sampleScale=Math.min(1,sampleMax/Math.max(source.naturalWidth,source.naturalHeight));sample.width=Math.max(1,Math.round(source.naturalWidth*sampleScale));sample.height=Math.max(1,Math.round(source.naturalHeight*sampleScale));const sx=sample.getContext('2d',{willReadFrequently:true});sx.drawImage(source,0,0,sample.width,sample.height);const pixels=sx.getImageData(0,0,sample.width,sample.height).data;let left=sample.width,top=sample.height,right=-1,bottom=-1;for(let y=0;y<sample.height;y++)for(let x=0;x<sample.width;x++)if(pixels[(y*sample.width+x)*4+3]>16){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}if(right<left){left=0;top=0;right=sample.width-1;bottom=sample.height-1}const sw=right-left+1,sh=bottom-top+1,out=document.createElement('canvas');out.width=256;out.height=256;const ox=out.getContext('2d');ox.imageSmoothingEnabled=true;ox.imageSmoothingQuality='high';const safe=224,scale=Math.min(safe/sw,safe/sh),dw=Math.max(1,Math.round(sw*scale)),dh=Math.max(1,Math.round(sh*scale));ox.drawImage(sample,left,top,sw,sh,Math.round((256-dw)/2),Math.round((256-dh)/2),dw,dh);return out.toDataURL('image/png')}
function icon(a){const safe=encodeURIComponent(a.name);return a.icon?'<img loading="lazy" src="/api/apps/'+safe+'/icon?v='+iconEpoch+'" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'icon\',textContent:'+JSON.stringify((a.name||'?')[0])+ ' }))">':'<div class="icon">'+(a.name||'?')[0]+'</div>'}
function isCustom(a){return actions.some(action=>action.type!=="icon"&&action.name===a.name)}function hasCustomIcon(a){return Boolean(a.customIcon)||actions.some(action=>action.icon&&((action.type==='icon'&&action.target===a.name)||action.name===a.name))}async function removeCustom(name){try{for(const piece of [...cfg.pieces].filter(piece=>piece.name===name))await removePiece(piece.id);await api('/api/windows/actions/'+encodeURIComponent(name),{method:'DELETE',body:'{}'});await load();toast('Item personalizado excluído')}catch(e){toast(e.message)}}function card(a,slot){const el=document.createElement(slot?'button':'div');el.type='button';el.className=slot?'tile':'library-card';if(hasCustomIcon(a))el.classList.add('custom-icon');el.draggable=true;el.dataset.name=a.name;el.dataset.id=a.id||'';const libraryRemove=!slot&&isCustom(a);el.innerHTML=icon(a)+'<label>'+a.name.replace(/^Teclado · /,'⌨ ')+'</label>'+(slot?'<span class="remove" title="Remover do painel">×</span>':libraryRemove?'<button class="remove" title="Excluir item personalizado" aria-label="Excluir item personalizado">×</button>':'');el.addEventListener('dragstart',e=>{if(e.target.closest('.remove'))return;e.dataTransfer.effectAllowed='move';drag={name:a.name,id:a.id||'',from:slot?'deck':'library'}});if(slot){el.querySelector('.remove').onclick=e=>{e.stopPropagation();removePiece(a.id)};el.onclick=e=>{if(!e.target.closest('.remove'))openEditor(a)}}else if(libraryRemove){el.querySelector('.remove').onclick=e=>{e.stopPropagation();removeCustom(a.name)}}return el}
function renderLibrary(){const q=$('search').value.toLowerCase();$('library').replaceChildren(...apps.filter(a=>a.name.toLowerCase().includes(q)).map(a=>card(a,false)))}
function renderDeck(){const by=new Map(cfg.pieces.map(p=>[p.position,p]));const slots=[],first=currentPage*8;for(let n=first;n<first+8;n++){const s=document.createElement('div');s.className='slot';s.dataset.position=n;const p=by.get(n);if(p){const app=apps.find(a=>a.name===p.name)||{...p,icon:false};s.append(card({...app,id:p.id},true))}s.ondragover=e=>{e.preventDefault();s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=e=>{e.preventDefault();s.classList.remove('over');dropTo(n)};slots.push(s)}$('deck').replaceChildren(...slots);const total=Math.max(1,cfg.pageCount||1);$('page-label').textContent='Página '+(currentPage+1)+' de '+total;$('prev-page').disabled=currentPage===0;$('next-page').disabled=currentPage>=total-1;$('remove-page').disabled=total<=1;$('add-page').disabled=total>=(cfg.limits?.maxPages||5)}
async function updatePositions(next){const positions={};next.forEach(p=>positions[p.id]=p.position);cfg=(await api('/api/config/pieces/order',{method:'PUT',body:JSON.stringify({revision:cfg.revision,ids:cfg.pieces.map(p=>p.id),positions})})).config;renderDeck()}
async function dropTo(position){if(!drag)return;try{const source=drag;drag=null;if(source.from==='library'){if(cfg.pieces.some(p=>p.position===position))return toast('Escolha um espaço vazio');if(!cfg.pieces.some(p=>p.name===source.name)){cfg=(await api('/api/config/pinned',{method:'POST',body:JSON.stringify({app:source.name})})).config}const added=cfg.pieces.find(p=>p.name===source.name);const next=cfg.pieces.map(p=>({...p}));next.find(p=>p.id===added.id).position=position;await updatePositions(next);toast('Adicionado ao painel')}else{const current=cfg.pieces.find(p=>p.id===source.id),other=cfg.pieces.find(p=>p.position===position);if(!current)return;if(other)other.position=current.position;current.position=position;await updatePositions(cfg.pieces.map(p=>({...p})))}}catch(e){toast(e.message)}}

async function load(){const [config,status,stored]=await Promise.all([api('/api/config'),api('/api/windows/status'),api('/api/windows/actions')]);actions=stored.actions||[];cfg=config.config;const activePort=status.port||location.port||3100;$('pin').textContent='PIN '+(status.pin||'—');$('port').textContent='PORTA '+activePort;$('port').dataset.value=activePort;$('network').textContent=status.address?'Acesso: http://'+status.address+':'+activePort:'Acesso pela mesma rede Wi-Fi';renderDeck();const installed=await api('/api/apps/installed');apps=installed.apps;iconEpoch=Date.now();renderLibrary();renderDeck()}

$('new-key').onclick=()=>{editing=null;$('key-dialog').querySelector('h2').textContent='Novo atalho';$('key-title').disabled=false;$('key-title').value='';document.querySelector('.mods').style.display='flex';$('key-value').style.display='block';$('key-icon').value='';iconDirty=true;drawShortcutIcon();$('key-dialog').showModal();$('key-title').focus()};$('save-key').onclick=async e=>{e.preventDefault();try{const title=$('key-title').value.trim(),shortcut=!editing||editing.type==='shortcut',mods=[...document.querySelectorAll('.mods input:checked')].map(x=>x.value),combo=[...mods,$('key-value').value].join('+');if(!title)throw Error('Informe um nome');let action;if(shortcut)action=await api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'shortcut',title,combo})});else action=await api('/api/windows/actions',{method:'POST',body:JSON.stringify({type:'app',title:editing.title,path:editing.path})});if(iconDirty){const image=$('key-icon').files[0],dataUrl=image?await new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(image)}):$('key-preview').toDataURL('image/png');action=await api('/api/windows/actions/icon',{method:'POST',body:JSON.stringify({name:action.action.name,dataUrl})})}$('key-dialog').close();await load();toast(editing?'Alterações salvas':'Atalho criado')}catch(err){$('form-error').textContent=err.message}};$('prev-page').onclick=()=>{if(currentPage){currentPage--;renderDeck()}};$('next-page').onclick=()=>{if(currentPage<(cfg.pageCount||1)-1){currentPage++;renderDeck()}};$('add-page').onclick=async()=>{try{cfg=(await api('/api/config/pages',{method:'POST',body:'{}'})).config;currentPage=cfg.pageCount-1;renderDeck();toast('Nova página criada')}catch(e){toast(e.message)}};$('remove-page').onclick=async()=>{if((cfg.pageCount||1)<=1)return;try{cfg=(await api('/api/config/pages',{method:'DELETE',body:'{}'})).config;currentPage=Math.min(currentPage,cfg.pageCount (()=>{const pin=document.getElementById('pin'),auto=document.getElementById('pin-auto'),port=document.getElementById('port'),search=document.getElementById('search'),theme=document.getElementById('theme-toggle'),themeKey='ezdeck-theme';function setTheme(value){const dark=value==='dark';document.documentElement.dataset.theme=dark?'dark':'light';theme.textContent=dark?'☀':'☾';const label=dark?'Ativar modo claro':'Ativar modo escuro';theme.title=label;theme.setAttribute('aria-label',label)}let saved=null;try{saved=localStorage.getItem(themeKey)}catch(e){}setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));theme.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(themeKey,next)}catch(e){}setTheme(next)};const wrap=document.createElement('div');wrap.className='search-wrap';search.replaceWith(wrap);wrap.append(search);const clear=document.createElement('button');clear.type='button';clear.className='clear-search';clear.textContent='×';clear.title='Limpar busca';wrap.append(clear);clear.onclick=()=>{search.value='';search.dispatchEvent(new Event('input'));search.focus()};async function setPin(value){const r=await fetch('/api/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value?{pin:value}:{})});const b=await r.json();if(!r.ok)throw Error(b.error||'Não foi possível alterar o PIN');pin.textContent='PIN '+b.pin}function dialog(title,body,ok,confirmLabel='Confirmar'){const d=document.createElement('dialog');d.innerHTML='<form class="form" method="dialog"><h2>'+title+'</h2>'+body+'<div class="actions"><button class="button" id="cancel" type="button">Cancelar</button><button class="button" id="ok" type="submit">'+confirmLabel+'</button></div></form>';document.body.append(d);const dispose=()=>{if(d.isConnected){d.close();d.remove()}};d.querySelector('#cancel').onclick=dispose;d.addEventListener('cancel',e=>{e.preventDefault();dispose()});d.querySelector
