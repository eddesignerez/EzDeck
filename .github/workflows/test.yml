name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Um handle residual de browser/servidor não pode deixar o check protegido
    # da main preso: o runner limita o job e cada teste sem timeout próprio.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 --test-timeout=5000 --test-force-exit --test-reporter=spec
