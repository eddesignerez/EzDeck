name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Um handle residual de browser/servidor não pode deixar o check protegido
    # da main preso depois que todos os testes já concluíram.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run isolated test files
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for test_file in test/*.{mjs,js}; do
            [ -f "$test_file" ] || continue
            echo "::group::$test_file"
            if ! timeout --signal=TERM --kill-after=10s 60s node --test --test-force-exit --test-reporter=spec "$test_file"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
