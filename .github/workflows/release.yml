name: Build signed release artifacts

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: Build the signed Android APK (requires Android signing secrets)
        required: true
        default: false
        type: boolean
      sign_windows:
        description: Send the Windows installer to SignPath (requires SignPath approval and secrets)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        shell: pwsh
        run: ./windows/package-installer.ps1
      - name: Upload unsigned Windows installer
        id: unsigned_windows
        uses: actions/upload-artifact@v4
        with:
          name: EzDeck-Setup-unsigned
          path: dist/EzDeck-Setup.exe
          if-no-files-found: error
      - name: Submit Windows installer to SignPath
        if: inputs.sign_windows
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned_windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed
      - name: Upload signed Windows installer
        if: inputs.sign_windows
        uses: actions/upload-artifact@v4
        with:
          name: EzDeck-Setup-signed
          path: dist/signed/**
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/main' && inputs.build_android
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Android signing key
        shell: pwsh
        env:
          EZDECK_RELEASE_KEYSTORE_BASE64: ${{ secrets.EZDECK_RELEASE_KEYSTORE_BASE64 }}
          EZDECK_RELEASE_STORE_PASSWORD: ${{ secrets.EZDECK_RELEASE_STORE_PASSWORD }}
          EZDECK_RELEASE_KEY_ALIAS: ${{ secrets.EZDECK_RELEASE_KEY_ALIAS }}
          EZDECK_RELEASE_KEY_PASSWORD: ${{ secrets.EZDECK_RELEASE_KEY_PASSWORD }}
        run: |
          $keyPath = "$env:GITHUB_WORKSPACE\android\app\release\ezdeck-release.jks"
          New-Item -ItemType Directory -Force (Split-Path -Parent $keyPath) | Out-Null
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:EZDECK_RELEASE_KEYSTORE_BASE64))
          @(
            "EZDECK_RELEASE_STORE_FILE=$keyPath",
            "EZDECK_RELEASE_STORE_PASSWORD=$env:EZDECK_RELEASE_STORE_PASSWORD",
            "EZDECK_RELEASE_KEY_ALIAS=$env:EZDECK_RELEASE_KEY_ALIAS",
            "EZDECK_RELEASE_KEY_PASSWORD=$env:EZDECK_RELEASE_KEY_PASSWORD"
          ) | Set-Content -LiteralPath "$env:GITHUB_WORKSPACE\android\gradle.properties" -Encoding utf8
      - name: Build Android release APK
        shell: pwsh
        run: ./gradlew.bat assembleRelease --console=plain
        working-directory: android
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: EzDeck-Android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
